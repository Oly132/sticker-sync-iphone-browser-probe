name: Build iPhone browser probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile without Apple credentials
        run: |
          xcodebuild -project BrowserProbe.xcodeproj -scheme BrowserProbe -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package for local signing
        run: |
          mkdir -p artifacts/Payload
          cp -R build/Build/Products/Release-iphoneos/BrowserProbe.app artifacts/Payload/
          cd artifacts
          /usr/bin/zip -q -r StickerSync-iPhone-browser-probe-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-browser-probe-unsigned
          path: artifacts/StickerSync-iPhone-browser-probe-unsigned.ipa
          retention-days: 1
